{% extends "base.html" %}
{% block title %}文件列表{% endblock %}

{% block content %}

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<!-- jQuery + DataTables JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<style>
/* 表头颜色 */
#deviceTable thead th {
    background-color: #8152f8ff !important; /* 鲜艳橙红色 */
    color: #ffffff !important;
    font-weight: bold;
    text-align: center;
}

/* tbody 斑马条纹 */
#deviceTable tbody tr:nth-child(odd) {
    background-color: #ffe0b2; 
    color: #212529;
}
#deviceTable tbody tr:nth-child(even) {
    background-color: #fff3e0; 
    color: #212529;
}

/* 下载按钮 */
.btn-download {
    background-color: #4caf50;
    color: #fff;
    border: none;
}
.btn-download:hover {
    background-color: #388e3c;
}
/* 删除按钮 */
.btn-delete {
    background-color: #f44336 !important; /* 红色 */
    color: #fff !important;
    border: none;
}
.btn-delete:hover {
    background-color: #d32f2f !important; /* 深红色 */
}
/* 分页按钮 */
.dataTables_wrapper .dataTables_paginate .paginate_button {
    background-color: #ff9800 !important; 
    color: #fff !important;
    border-radius: 4px;
    margin: 2px;
}
.dataTables_wrapper .dataTables_paginate .paginate_button.current {
    background-color: #f44336 !important; 
    color: #fff !important;
}

/* 搜索框 & show entries 控件 */
.dataTables_wrapper .dataTables_filter input,
.dataTables_wrapper .dataTables_length select {
    background-color: #fff59d !important;
    color: #212529 !important;
    border: 1px solid #fbc02d !important;
    border-radius: 4px;
}

/* 分页信息文字 */
.dataTables_wrapper .dataTables_info {
    color: #212529;
}
</style>

<div class="container mt-4">
    <h2 class="mb-4">文件列表</h2>
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    {% endif %}
    <table id="deviceTable" class="table table-bordered table-striped table-sm">
        <thead>
            <tr>
                <th>#</th>
                <th>文件名</th>
                <th>上传时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for f in files %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ f.filename }}</td>
                <td>{{ f.uploaded_at }}</td>
                <td>
                    <!-- 下载图标 -->
                    <a href="{% url 'filecenter:download' f.pk %}" class="btn btn-sm btn-download" title="下载">
                        <i class="bi bi-download"></i>
                    </a>
                    <!-- 删除图标 -->
                    <a href="{% url 'filecenter:delete' f.pk %}" class="btn btn-sm btn-delete ms-1" title="删除">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
$(document).ready(function() {
    $('#deviceTable').DataTable({
        "paging": true,
        "searching": true,
        "ordering": true,
        "order": [[2, "desc"]], // 默认按上传时间降序
        "columnDefs": [
            { "orderable": false, "targets": 3 } // 操作列不能排序
        ]
    });
});
</script>

{% endblock %}
