<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>乾颐堂Django登录</title>
    {% load static %}
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
    <link rel="shortcut icon" href="{% static "img/favicon.ico"%}">
    <link rel="stylesheet" href="{% static "css/sign-in.css" %}">

</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="form-signin w-100 m-auto">
      <form action="" method="post"> {# Removed redundant class="form-signin" from form tag #}
          {% csrf_token %}
          <img class="mb-4" src="{% static "img/logo.png"%}" alt="" width= auto height="100">
          <h1 class="h3 mb-3 fw-normal">请登录</h1>

          {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
          {% endif %}
          {% for field in form %}
          <div class="form-floating mb-3">
              {{ field }}
              <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          </div>
          {% endfor %}
          <button class="btn btn-primary w-100 py-2" type="submit">登录</button>
          <p class="mt-5 mb-3 text-body-secondary">&copy; 2019-2025</p> 
      </form>
    </main>
</body>
</html>
