<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    {% load static %}

    <title>{% block title %}首页{% endblock title %}</title>

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="{% static 'img/favicon.ico' %}" rel="shortcut icon"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    {% block list_extra_css %}{% endblock list_extra_css %}
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">

    <a href="/" class="navbar-brand">
      <img src="{% static 'img/logo.png' %}" height="50" alt="logo">
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            设备管理
          </a>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'device_list' %}">设备列表</a></li>
            <li>
              <a class="dropdown-item" href="{% url 'add_device' %}">
                添加设备
              </a>
            </li>
          </ul>
        </li>

      </ul>

      <form class="d-flex" role="search" method="get" action="{% url 'device_list' %}">
        <input class="form-control me-2 flex-grow-1" 
        type="search" 
        style="width: 30ch;"
        placeholder=" Search Hostname / IP Address " 
        name="q" value="{{ q|default:'' }}"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>

    </div>
  </div>
</nav>


{% block content %}{% endblock content %}


<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

{% block extra_js %}{% endblock extra_js %}
</body>
</html>
