<!-- templates/devices/collect.html -->
<h2>采集 SNMP 数据</h2>

<form method="post">
  {% csrf_token %}
  <label for="device">选择设备:</label>
  <select name="device_id" id="device">
    {% for d in devices %}
      <option value="{{ d.id }}">{{ d.hostname }} ({{ d.ip_address }})</option>
    {% endfor %}
  </select>
  <button type="submit">采集一次</button>
</form>

<h3>最近采集记录</h3>
<table border="1" style="border-collapse: collapse; width: auto; table-layout: auto;">
  <tr>
    <th>指标</th>
    <th>时间</th>
    <th>数据</th>
  </tr>
  {% for m in metrics %}
  <tr>
    <td>{{ m.metric_type.name }}</td>
    <td>{{ m.timestamp }}</td>
    <td>{{ m.metrics }}</td>
  </tr>
  {% endfor %}
</table>
